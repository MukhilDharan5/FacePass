[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "facepass-liveness"
version = "0.14.0"
description = "Local RGB research and experimental Fedora KDE face authentication"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mediapipe==1.0.1",
    "numpy>=2.2,<3",
    "opencv-contrib-python>=4.13,<5",
]

[project.scripts]
facepass = "facepass.cli:main"
facepass-evaluate = "facepass.evaluation:main"
facepass-daemon = "facepass.daemon:main"
facepass-client = "facepass.client:main"
facepass-auth = "facepass.auth_cli:main"
facepass-enroll = "facepass.enrollment_ui:main"

[tool.setuptools.packages.find]
where = ["src"]
